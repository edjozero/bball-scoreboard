<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="container">
        <div class="scoreboard">
            <h3>HOME</h3>
            <p id="home-score" class="score">0</p>
            <div class="buttons">
                <button class="pointsBtn" onclick="addPoints('home', 1)">+1</button>
                <button class="pointsBtn" onclick="addPoints('home', 2)">+2</button>
                <button class="pointsBtn" onclick="addPoints('home', 3)">+3</button>
            </div>
        </div>

        <button class="resetBtn" onclick="resetScores()">Reset</button>

        <div class="scoreboard">
            <h3>GUEST</h3>
            <p id="guest-score" class="score">0</p>
            <div class="buttons">
                <button class="pointsBtn" onclick="addPoints('guest', 1)">+1</button>
                <button class="pointsBtn" onclick="addPoints('guest', 2)">+2</button>
                <button class="pointsBtn" onclick="addPoints('guest', 3)">+3</button>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
  </body>

</html>
